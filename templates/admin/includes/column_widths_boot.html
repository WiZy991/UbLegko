<script>
(function () {
  window.ublegkoColumnStorageKeyName = "{{ col_key|escapejs }}";

  function bodyKey() {
    var app = "";
    var model = "";
    if (!document.body) return "";
    document.body.classList.forEach(function (name) {
      if (!app && name.indexOf("app-") === 0) app = name;
      if (!model && name.indexOf("model-") === 0) model = name;
    });
    return app ? "ublegko-cols:" + app + ":" + model : "";
  }

  function readRaw(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }

  window.ublegkoReadColumns = function () {
    var names = [];
    if (window.ublegkoColumnStorageKeyName) names.push(window.ublegkoColumnStorageKeyName);
    var fromBody = bodyKey();
    if (fromBody && names.indexOf(fromBody) === -1) names.push(fromBody);
    for (var i = 0; i < names.length; i++) {
      var raw = readRaw(names[i]);
      if (!raw) continue;
      try {
        var data = JSON.parse(raw);
        if (data && typeof data === "object" && Object.keys(data).length) return data;
      } catch (e) {}
    }
    if ((window.ublegkoColumnStorageKeyName || "").indexOf("model-product") !== -1) {
      try {
        var old = JSON.parse(readRaw("ublegko-product-admin-layout") || "{}");
        if (old && old.columns && typeof old.columns === "object") return old.columns;
      } catch (e) {}
    }
    return {};
  };

  window.ublegkoWriteColumns = function (columns) {
    var key = window.ublegkoColumnStorageKeyName || bodyKey();
    if (!key) return;
    try { localStorage.setItem(key, JSON.stringify(columns)); } catch (e) {}
  };

  window.ublegkoColumnKey = function (th) {
    if (!th) return "";
    if (th.classList.contains("action-checkbox-column")) return "action-checkbox";
    var classes = (th.className || "").split(/\s+/);
    for (var i = 0; i < classes.length; i++) {
      if (classes[i].indexOf("column-") === 0) return classes[i];
    }
    return "";
  };

  function columnMin(key) {
    if (key === "action-checkbox" || key === "column-expand_toggle") return 32;
    return 56;
  }

  function columnSelectors(key) {
    if (key === "action-checkbox") {
      return ["th.action-checkbox-column", "td.action-checkbox"];
    }
    if (key.indexOf("column-") !== 0) return [];
    return ["th." + key, "td.field-" + key.slice("column-".length)];
  }

  function writeWidthStyle(css) {
    var style = document.getElementById("ublegko-col-widths");
    if (!css) {
      if (style) style.textContent = "";
      return;
    }
    if (!style) {
      style = document.createElement("style");
      style.id = "ublegko-col-widths";
      document.head.appendChild(style);
    }
    style.textContent = css;
  }

  window.ublegkoPaintColumns = function (table) {
    var headers = table.querySelectorAll("thead th");
    var pixels = window.ublegkoColPixels || [];
    var sum = 0;
    var css = "";
    var ready = headers.length > 0;
    Array.prototype.forEach.call(headers, function (th, index) {
      var px = Math.round(pixels[index] || 0);
      if (px < columnMin(window.ublegkoColumnKey(th))) ready = false;
      sum += px;
    });
    if (!ready || !sum) return;
    var group = table.querySelector("colgroup");
    if (!group) {
      group = document.createElement("colgroup");
      table.insertBefore(group, table.firstChild);
    }
    while (group.children.length < headers.length) group.appendChild(document.createElement("col"));
    while (group.children.length > headers.length) group.removeChild(group.lastChild);
    Array.prototype.forEach.call(headers, function (th, index) {
      var px = Math.round(pixels[index]);
      group.children[index].style.width = px + "px";
      th.style.setProperty("width", px + "px", "important");
      th.style.setProperty("min-width", px + "px", "important");
      th.style.setProperty("max-width", px + "px", "important");
      var key = window.ublegkoColumnKey(th);
      var clip = "";
      if (key === "column-short_problem") {
        clip = "white-space:nowrap !important;overflow:hidden !important;text-overflow:ellipsis !important;";
      } else if (key === "column-access_role_col" || key === "column-membership_col") {
        clip = "overflow:visible !important;white-space:nowrap !important;";
      } else if (key !== "action-checkbox" && key !== "column-expand_toggle") {
        clip = "white-space:normal !important;overflow-wrap:anywhere !important;word-break:break-word !important;overflow:hidden !important;text-overflow:clip !important;";
      }
      columnSelectors(window.ublegkoColumnKey(th)).forEach(function (selector) {
        css += "html body.change-list #result_list " + selector +
          "{box-sizing:border-box !important;width:" + px + "px !important;min-width:" + px +
          "px !important;max-width:" + px + "px !important;" + clip + "}";
      });
    });
    var tableCss = "html body.change-list #result_list{table-layout:fixed !important;width:" +
      sum + "px !important;min-width:" + sum + "px !important;max-width:none !important;}";
    table.style.setProperty("table-layout", "fixed", "important");
    table.style.setProperty("width", sum + "px", "important");
    table.style.setProperty("min-width", sum + "px", "important");
    table.style.setProperty("max-width", "none", "important");
    writeWidthStyle(tableCss + css);
  };

  window.ublegkoApplySavedColumns = function (table) {
    if (!table) return;
    var hide = document.getElementById("ublegko-col-hide");
    if (hide) hide.remove();
    table.style.removeProperty("visibility");
    if (table.getAttribute("data-cols-applied") === "1") return;
    table.setAttribute("data-cols-applied", "1");
    if (window.innerWidth <= 900) return;
    var saved = window.ublegkoReadColumns();
    var headers = table.querySelectorAll("thead th");
    if (!headers.length || !Object.keys(saved).length) return;
    var pixels = [];
    var complete = true;
    Array.prototype.forEach.call(headers, function (th, index) {
      var key = window.ublegkoColumnKey(th);
      var min = columnMin(key);
      var savedPx = key && saved[key] ? Math.round(Number(saved[key])) : 0;
      if (savedPx >= min) pixels[index] = savedPx;
      else complete = false;
    });
    if (!complete) return;
    window.ublegkoColPixels = pixels;
    window.ublegkoPaintColumns(table);
  };

  window.ublegkoSetColumnWidth = function (table, th, px) {
    if (window.innerWidth <= 900) return;
    var headers = table.querySelectorAll("thead th");
    if (!window.ublegkoColPixels || window.ublegkoColPixels.length !== headers.length) {
      window.ublegkoColPixels = [];
      Array.prototype.forEach.call(headers, function (header, index) {
        var key = window.ublegkoColumnKey(header);
        var measured = Math.round(header.getBoundingClientRect().width);
        window.ublegkoColPixels[index] = Math.max(columnMin(key), measured);
      });
    }
    var key = window.ublegkoColumnKey(th);
    window.ublegkoColPixels[th.cellIndex] = Math.max(columnMin(key), Math.round(px));
    window.ublegkoPaintColumns(table);
    var stored = {};
    Array.prototype.forEach.call(headers, function (header, index) {
      var colKey = window.ublegkoColumnKey(header);
      if (colKey && window.ublegkoColPixels[index]) stored[colKey] = window.ublegkoColPixels[index];
    });
    window.ublegkoWriteColumns(stored);
  };
})();
</script>
