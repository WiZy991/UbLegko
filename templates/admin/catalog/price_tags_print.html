{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{% static 'admin/css/price_tags.css' %}?v=20261128tags6">
</head>
<body class="pricetags-print">
  <div class="pricetags-print__bar">
    <button type="button" onclick="window.print()">Печать</button>
    <script>
      window.addEventListener('load', function () {
        var ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
        ready.then(function () { window.print(); });
      });
    </script>
    <span>{{ tags|length }} шт., {{ tag_width_cm }} × {{ tag_height_cm }} см</span>
  </div>
  {% if tags %}
    <div class="pricetags-print__sheet">
      {% for tag in tags %}
        {% include "admin/catalog/includes/price_tag_card.html" %}
      {% endfor %}
    </div>
  {% else %}
    <p>Товары не выбраны.</p>
  {% endif %}
</body>
</html>
