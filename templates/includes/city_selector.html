<div class="city-selector" data-city-selector>
  <button type="button" class="city-selector__toggle" data-city-toggle aria-expanded="false" aria-haspopup="listbox">
    <span data-city-label>{{ selected_city_name }}</span>
    <span class="city-selector__arrow" aria-hidden="true">▾</span>
  </button>
  <div class="city-selector__dropdown" data-city-dropdown hidden>
    <div class="city-selector__search">
      <input type="search" placeholder="Поиск города..." data-city-search autocomplete="off">
    </div>
    <ul class="city-selector__list" role="listbox" data-city-list>
      {% for city in cities %}
        <li>
          <button
            type="button"
            class="city-selector__item {% if selected_city and selected_city.id == city.id %}is-active{% endif %}"
            data-city-id="{{ city.id }}"
            data-city-name="{{ city.display_name }}"
            data-city-filter="{{ city.name|lower }} {{ city.display_name|lower }}"
          >
            {{ city.display_name }}
          </button>
        </li>
      {% empty %}
        <li class="city-selector__empty">Города не добавлены</li>
      {% endfor %}
    </ul>
    <p class="city-selector__empty" data-city-empty hidden>Ничего не найдено</p>
  </div>
</div>
<form id="city-set-form" action="{% url 'core:set_city' %}" method="post" class="visually-hidden">
  {% csrf_token %}
  <input type="hidden" name="city_id" value="" data-city-input>
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
</form>
