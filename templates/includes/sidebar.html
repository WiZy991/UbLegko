<button type="button" class="menu-toggle" id="menu-toggle" aria-expanded="true" data-menu-toggle>Категории</button>
<aside class="sidebar is-open" id="sidebar" data-sidebar>
  <p class="sidebar__title">Каталог</p>
  <a
    href="{% url 'catalog:home' %}"
    class="{% if not current_category %}is-active{% endif %}"
    data-catalog-nav
    data-scroll-spy-home
  >Все товары</a>
  {% for category in categories %}
    {% if scroll_spy_categories %}
      <a
        href="#category-{{ category.slug }}"
        class="sidebar__link"
        data-scroll-spy-link="category-{{ category.slug }}"
      >{{ category.name }}</a>
    {% else %}
      <a
        href="{{ category.get_absolute_url }}"
        class="{% if current_category and current_category.id == category.id %}is-active{% endif %}"
        data-catalog-nav
      >{{ category.name }}</a>
    {% endif %}
  {% empty %}
    <p style="padding:12px 16px;color:#888;">Категории пока не добавлены</p>
  {% endfor %}
</aside>
