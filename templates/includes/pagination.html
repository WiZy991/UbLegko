{% load catalog_extras %}
{% if page_obj and page_obj.has_other_pages %}
  <nav class="pagination" aria-label="Страницы">
    {% if page_obj.has_previous %}
      <a href="{% catalog_query page=page_obj.previous_page_number %}" data-catalog-nav>← Назад</a>
    {% endif %}
    <span>Стр. {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <a href="{% catalog_query page=page_obj.next_page_number %}" data-catalog-nav>Вперёд →</a>
    {% endif %}
  </nav>
{% endif %}
